<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Staff Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login_staff.css')}}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="staff_mode">
    <div class="login-layout">
        <div class="login-card elevation-2">
            <!-- Header -->
             <div class="header-section">
                <div class="icon-container">
                    <img src="{{ url_for('static', filename='public/images/staff.gif')}}" alt="Logo" class="brand-icon">
                </div>
                <h1>Forgot Password</h1>
                <p class="subtitle">Enter your staff code and email to reset your password</p>
             </div>

             <!-- Error Feedback -->
              {% if error %}
              <div class="error-banner" role="alert">
                <span class="error-icon">⚠️</span>
                <span class="error-text">{{ error }}</span>
              </div>
              {% endif %}

              <form method="POST" action="{{ url_for('forgot_password') }}" id="forgotForm">

                <!-- Staff Code Input -->
                <div class="input-group">
                    <label for="staff_code">Staff Code</label>
                    <div class="input-wrapper">
                    <input type="text" id="staff_code" name="staff_code"
                            placeholder="e.g. DR-0001 or PHARM-0001" required>
                        <span class="focus-border"></span>
                    </div>
                </div>

                <!-- Email Input -->
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" name="email"
                            placeholder="your.email@hospital.my" required>
                        <span class="focus-border"></span>
                    </div>
                </div>

                <button type="submit" class="btn primary-btn" id="submitBtn">
                    <span class="btn-text">Verify & Continue</span>
                    <div class="spinner" id="btnSpinner"></div>
                </button>

                <!-- Footer -->
                 <div class="form-footer">
                    <p><a href="{{ url_for('login_staff') }}" class="link secondary-link">Back to Login</a></p>
                 </div>
              </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/login_staff.js')}}"></script>
</body>
</html>
