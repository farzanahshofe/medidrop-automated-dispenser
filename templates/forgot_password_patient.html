<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Patient Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login_patient.css')}}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display-swap" rel="stylesheet">
</head>
<body>
    <div class="login-layout">
        <div class="login-card elevation-2">
            <!-- Header -->
             <div class="header-section">
                <div class="icon-container">
                    <img src="{{ url_for('static', filename='public/images/medicine.gif')}}" alt="Logo" class="brand-icon">
                </div>
                <h1>Forgot Password</h1>
                <p class="subtitle">Enter your IC number and email to reset your password</p>
             </div>

             <!-- Error Feedback -->
              {% if error %}
              <div class="error-banner" role="alert">
                <span class="error-icon">⚠️</span>
                <span class="error-text">{{ error }}</span>
              </div>
              {% endif %}

              <form method="POST" action="{{ url_for('forgot_password_patient') }}" id="forgotForm">

                <!-- IC Number Input -->
                <div class="input-group">
                    <label for="ic_number">IC Number</label>
                    <div class="input-wrapper">
                        <input type="text" id="ic_number" name="ic_number" placeholder="e.g 900110141234" maxlength="12" required>
                        <span class="focus-border"></span>
                    </div>
                    <span class="helper-text">Enter your 12-digit Identity Card number</span>
                </div>

                <!-- Email Input -->
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" name="email"
                            placeholder="your.email@example.com" required>
                        <span class="focus-border"></span>
                    </div>
                </div>

                <button type="submit" class="btn primary-btn" id="submitBtn">
                    <span class="btn-text">Verify & Continue</span>
                    <div class="spinner" id="btnSpinner"></div>
                </button>

                <!-- Footer -->
                 <div class="form-footer">
                    <p><a href="{{ url_for('login_patient') }}" class="link">Back to Login</a></p>
                 </div>
              </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/login_patient.js')}}"></script>
</body>
</html>
