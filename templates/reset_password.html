<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login_staff.css')}}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css')}}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display-swap" rel="stylesheet">
</head>
<body>
    <div class="login_layout">
        <div class="login_card elevation-2">
            <!-- Header -->
            <div class="header_section">
                <h1>Security Password</h1>
                <p class="subtitle">Set your new password below</p>
            </div>

            <!-- Error Feedback -->
            {% if error %}
            <div class="error-banner" role="alert">
                <span class="error_icon">⚠️</span>
                <span class="error_text">{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" action="{{ url_for('force_password_reset') }}" id="resetForm">
                <div class="input-group">
                    <label for="new_password">New Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="new_password" name="new_password" placeholder="••••••••" required>
                        <span class="focus_border"></span>
                    </div>

                    <!-- Password Strength Bar -->
                    <div class="password-strength">
                        <div class="strength-bar">
                            <div id="strength-fill" class="strength-fill"></div>
                        </div>
                        <div id="strength-text" class="strength-text">Password strength</div>
                    </div>

                    <div class="password-requirements">
                        <div id="req-len" class="req-item">At least 8 characters</div>
                        <div id="req-cap" class="req-item">At least 1 uppercase letter (A-Z)</div>
                        <div id="req-low" class="req-item">At least 1 lowercase letter (a-z)</div>
                        <div id="req-num" class="req-item">At least 1 number (0-9)</div>
                        <div id="req-sym" class="req-item">At least 1 symbol (.!@#$%^&*)</div>
                    </div>
                </div>

                <div class="input-group">
                    <label for="confirm_password">Confirm New Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-type password" required>
                        <span class="focus_border"></span>
                    </div>
                    <div id="match-status" class="helper-text" style="display: none;">Passwords do not match</div>
                </div>

                <button type="submit" class="btn primary_btn staff-btn" id="submitBtn" disabled>
                    Set New Password
                </button>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/reset_password.js')}}"></script>
</body>
</html>
